services:
  - type: static
    name: optitab-frontend
    rootDirectory: frontend
    buildCommand: npm ci && npm run build
    publishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      # Base URL de l'API backend
      - key: VITE_API_BASE_URL
        value: https://optitab-backend.onrender.com
      - key: VITE_SITE_URL
        value: https://optitab.net
      # URL publique des médias S3 (utilisée côté frontend pour l'affichage direct)
      - key: VITE_S3_MEDIA_URL
        fromSecret: s3_public_media_base
      - key: VITE_GTM_ID
        value: GTM-M7GWMJ85
  - type: web
    name: optitab-backend
    rootDirectory: .
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: ./start.sh
    # Disque persistant pour stocker les fichiers médias Django
    disk:
      name: media
      # Monter en dehors du repo pour éviter un écrasement lors des déploiements
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: backendAPI.settings
      - key: PYTHONPATH
        value: /opt/render/project/src:/opt/render/project/src/backend
      - key: MEDIA_ROOT
        value: /data
      - key: FRONTEND_BASE_URL
        value: https://optitab.net
      # Gunicorn: limiter la consommation mémoire sur les petits plans
      - key: GUNICORN_WORKERS
        value: 1
      - key: GUNICORN_THREADS
        value: 1
      - key: GUNICORN_TIMEOUT
        value: 120
      - key: GUNICORN_MAX_REQUESTS
        value: 1000
      - key: GUNICORN_MAX_REQUESTS_JITTER
        value: 100
      # ===== AWS S3 (définir ces secrets dans Render) =====
      - key: AWS_ACCESS_KEY_ID
        fromSecret: aws_access_key_id
      - key: AWS_SECRET_ACCESS_KEY
        fromSecret: aws_secret_access_key
      - key: AWS_STORAGE_BUCKET_NAME
        fromSecret: aws_bucket_name
      - key: AWS_S3_REGION_NAME
        fromSecret: aws_region
      # Optionnel si vous avez un domaine personnalisé (CloudFront ou S3 static website)
      - key: AWS_S3_CUSTOM_DOMAIN
        fromSecret: aws_s3_custom_domain
      # Configuration email pour la réinitialisation de mot de passe
      - key: EMAIL_HOST
        fromSecret: email_host
      - key: EMAIL_PORT
        fromSecret: email_port
      - key: EMAIL_HOST_USER
        fromSecret: email_host_user
      - key: EMAIL_HOST_PASSWORD
        fromSecret: email_host_password
      - key: DEFAULT_FROM_EMAIL
        fromSecret: default_from_email
      - key: EMAIL_USE_TLS
        value: True
