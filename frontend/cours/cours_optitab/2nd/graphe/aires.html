<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
    /* Configuration globale pour un look professionnel */
    :root {
        --primary-color: #0056b3; /* Bleu professionnel */
        --secondary-color: #f4f7f6; /* Fond gris très clair */
        --text-color: #333;
        --card-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }

    body {
        font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        background-color: var(--secondary-color);
        color: var(--text-color);
        padding: 20px;
    }

    h2.main-title {
        text-align: center;
        color: var(--primary-color);
        margin-bottom: 30px;
    }

    /* La Grille : Configuration 3 par ligne */
    .aire-grid {
        display: grid;
        /* Force exactement 3 colonnes de largeur égale */
        grid-template-columns: repeat(3, 1fr);
        gap: 25px; /* Espace entre les cartes */
        max-width: 1200px;
        margin: 0 auto;
    }

    /* Styles des Cartes individuelles */
    .area-card {
        background: white;
        border-radius: 12px;
        padding: 25px;
        box-shadow: var(--card-shadow);
        text-align: center;
        transition: transform 0.2s ease;
        border-top: 4px solid var(--primary-color);
    }

    .area-card:hover {
        transform: translateY(-5px); /* Léger effet au survol */
        box-shadow: 0 6px 12px rgba(0,0,0,0.1);
    }

    .area-card h3 {
        margin-top: 0;
        color: var(--primary-color);
        font-size: 1.4em;
    }

    /* Zone visuelle (SVG) */
    .shape-container {
        height: 180px;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 20px 0;
        background-color: #fafafa;
        border-radius: 8px;
    }

    svg {
        max-height: 100%;
        max-width: 100%;
    }

    /* Style des labels sur les schémas */
    .label-text {
        font-family: sans-serif;
        font-size: 16px;
        fill: #d9534f; /* Rouge pour les mesures */
        font-weight: bold;
    }

    /* Zone de la formule */
    .formula-box {
        background-color: #eef2f5;
        padding: 15px;
        border-radius: 8px;
        font-size: 1.2em;
        font-weight: bold;
    }

    .formula-label {
        display: block;
        font-size: 0.9em;
        color: #666;
        margin-bottom: 5px;
        font-weight: normal;
    }

    /* Gestion responsive pour les petits écrans si besoin */
    @media (max-width: 900px) {
        .aire-grid {
             /* Passe à 2 par ligne sur tablette, ou 1 sur mobile si on veut */
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        }
    }
</style>
</head>
<body>

<h2 class="main-title">Formulaire des Aires Géométriques de Base</h2>

<div class="aire-grid">

    <div class="area-card">
        <h3>Le Carré</h3>
        <div class="shape-container">
            <svg width="150" height="150" viewBox="0 0 170 170">
                <rect x="10" y="10" width="130" height="130" fill="#dfeeff" stroke="#0056b3" stroke-width="3"/>
                <text x="75" y="160" class="label-text" text-anchor="middle">c</text>
                <text x="155" y="85" class="label-text" text-anchor="middle">c</text>
            </svg>
        </div>
        <div class="formula-box">
            <span class="formula-label">Formule de l'aire :</span>
            A = c × c = c²
        </div>
    </div>

    <div class="area-card">
        <h3>Le Rectangle</h3>
        <div class="shape-container">
            <svg width="200" height="150" viewBox="0 0 220 140">
                <rect x="10" y="20" width="180" height="100" fill="#dfeeff" stroke="#0056b3" stroke-width="3"/>
                <text x="100" y="140" class="label-text" text-anchor="middle">L (Longueur)</text>
                <text x="205" y="80" class="label-text" text-anchor="middle">l (largeur)</text>
            </svg>
        </div>
        <div class="formula-box">
            <span class="formula-label">Formule de l'aire :</span>
            A = L × l
        </div>
    </div>

    <div class="area-card">
        <h3>Le Cercle</h3>
        <div class="shape-container">
            <svg width="150" height="150" viewBox="0 0 160 160">
                <circle cx="80" cy="80" r="70" fill="#dfeeff" stroke="#0056b3" stroke-width="3"/>
                <line x1="80" y1="80" x2="150" y2="80" stroke="#d9534f" stroke-width="2"/>
                <circle cx="80" cy="80" r="3" fill="#d9534f"/>
                <text x="115" y="70" class="label-text" text-anchor="middle">r (rayon)</text>
            </svg>
        </div>
        <div class="formula-box">
            <span class="formula-label">Formule de l'aire :</span>
            A = π × r²
        </div>
    </div>

</div>

</body>
</html>
