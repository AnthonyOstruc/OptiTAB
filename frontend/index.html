<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <!-- Désactive l'assombrissement automatique des navigateurs en mode sombre -->
    <meta name="color-scheme" content="light" />
    <meta name="supported-color-schemes" content="light" />
    <title>OptiTAB - Cours particuliers &amp; ressources de maths</title>
    <script async src="https://www.googletagmanager.com/gtag/js?id=%VITE_GA_MEASUREMENT_ID%"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', '%VITE_GA_MEASUREMENT_ID%', { send_page_view: false });
    </script>
    <script>
      // Gestion simplifiée du viewport pour mobile
      (function() {
        // Écouter les changements d'orientation pour s'assurer que le viewport est correct
        window.addEventListener('orientationchange', function() {
          // Petit délai pour laisser le navigateur recalculer
          setTimeout(function() {
            // Déclencher un événement resize pour que Vue recalcule le zoom
            window.dispatchEvent(new Event('resize'));
          }, 150);
        });
      })();
    </script>
    <meta name="description" content="OptiTAB : cours particuliers et ressources en maths, physique et informatique. Cours et exercices gratuits, fiches, quiz et suivi de progression." />
    <meta name="robots" content="index,follow,max-snippet:-1,max-image-preview:large,max-video-preview:-1" />
    <link rel="canonical" href="https://www.optitab.net/" />

    <!-- Open Graph -->
    <meta property="og:site_name" content="OptiTAB" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="OptiTAB - Cours particuliers &amp; ressources de maths" />
    <meta property="og:description" content="Cours particuliers et ressources en maths, physique et informatique. Cours et exercices gratuits, fiches, quiz et suivi de progression." />
    <meta property="og:url" content="https://www.optitab.net/" />
    <meta property="og:image" content="https://www.optitab.net/Logo_bg.png" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="OptiTAB - Cours particuliers &amp; ressources de maths" />
    <meta name="twitter:description" content="Cours particuliers et ressources en maths, physique et informatique. Cours et exercices gratuits, fiches, quiz et suivi de progression." />
    <meta name="twitter:image" content="https://www.optitab.net/Logo_bg.png" />
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          // Activer les macros de texte (\text, \textbf, etc.) pour faciliter les tableaux
          packages: { '[+]': ['textmacros'] }
        },
        // IMPORTANT: utiliser un cache de police "none" pour que chaque équation SVG soit auto‑contenue.
        // Cela évite la perte des glyphes lors de la capture html2canvas/jsPDF.
        svg: {
          fontCache: 'none',
          scale: 1,
          minScale: 0.5,
          mtextInheritFont: true
        },
        options: {
          enableMenu: false,
          menuOptions: {
            settings: {
              texHints: true,
              semantics: false,
              zoom: 'NoZoom',
              zscale: '200%'
            }
          }
        },
        startup: {
          pageReady: () => {
            // Optimiser l'affichage sur mobile
            if (window.innerWidth <= 768) {
              MathJax.config.svg.scale = 0.9;
            }
            if (window.innerWidth <= 480) {
              MathJax.config.svg.scale = 0.8;
            }
            return MathJax.startup.defaultPageReady();
          }
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
