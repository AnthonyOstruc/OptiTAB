<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=0.5, user-scalable=yes, viewport-fit=cover, shrink-to-fit=no" />
    <title>OptiTAB - Excellence en Tutorat</title>
    <script>
      // Empêcher le zoom automatique sur mobile après orientation change
      (function() {
        var viewport = document.querySelector('meta[name="viewport"]');
        function fixViewport() {
          if (viewport) {
            viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=5.0, minimum-scale=0.5, user-scalable=yes, viewport-fit=cover, shrink-to-fit=no');
          }
        }
        // Fixer après chargement
        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', fixViewport);
        } else {
          fixViewport();
        }
        // Fixer après changement d'orientation
        window.addEventListener('orientationchange', function() {
          setTimeout(fixViewport, 100);
        });
        // Assurer que le zoom est à 100% au chargement
        window.addEventListener('load', function() {
          if (window.visualViewport) {
            // Utiliser visualViewport si disponible pour un meilleur contrôle
            var initialScale = window.visualViewport.scale;
            if (initialScale !== 1.0) {
              // Forcer le reset si le zoom est différent de 1.0
              fixViewport();
            }
          }
        });
      })();
    </script>
    <meta name="description" content="OptiTAB - Votre plateforme de tutorat professionnelle en France" />
    <script>
      window.MathJax = {
        tex: {
          inlineMath: [['$', '$'], ['\\(', '\\)']],
          displayMath: [['$$', '$$'], ['\\[', '\\]']],
          // Activer les macros de texte (\text, \textbf, etc.) pour faciliter les tableaux
          packages: { '[+]': ['textmacros'] }
        },
        // IMPORTANT: utiliser un cache de police "none" pour que chaque équation SVG soit auto‑contenue.
        // Cela évite la perte des glyphes lors de la capture html2canvas/jsPDF.
        svg: {
          fontCache: 'none',
          scale: 1,
          minScale: 0.5,
          mtextInheritFont: true
        },
        options: {
          enableMenu: false,
          menuOptions: {
            settings: {
              texHints: true,
              semantics: false,
              zoom: 'NoZoom',
              zscale: '200%'
            }
          }
        },
        startup: {
          pageReady: () => {
            // Optimiser l'affichage sur mobile
            if (window.innerWidth <= 768) {
              MathJax.config.svg.scale = 0.9;
            }
            if (window.innerWidth <= 480) {
              MathJax.config.svg.scale = 0.8;
            }
            return MathJax.startup.defaultPageReady();
          }
        }
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js"></script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
