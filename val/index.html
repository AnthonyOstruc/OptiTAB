<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>💘</title>
  <style>
    *{ box-sizing:border-box; margin:0; padding:0; }
    body{
      min-height:100vh;
      display:grid; place-items:center;
      font-family: ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #ffecd2, #fcb69f);
      overflow:hidden;
      color:#1f2937;
    }

    .card{
      width:min(440px, 90vw);
      background: rgba(255,255,255,.75);
      backdrop-filter: blur(16px);
      border:1px solid rgba(255,255,255,.5);
      border-radius:28px;
      padding:40px 32px 36px;
      text-align:center;
      box-shadow: 0 20px 60px rgba(0,0,0,.12);
      position:relative;
      overflow:hidden;
    }

    .gif-top{
      margin-bottom:16px;
      border-radius:16px;
      overflow:hidden;
      display:none;
    }
    .gif-top img{
      width:100%; border-radius:16px;
      display:block;
    }
    .success .gif-top{ display:block; }
    h1{ font-size:26px; font-weight:800; margin-bottom:8px; }
    .sub{ color:#6b7280; font-size:15px; margin-bottom:28px; min-height:22px; }

    .buttons{
      display:flex; gap:14px;
      justify-content:center; align-items:center;
    }
    button{
      border:0; border-radius:999px;
      padding:14px 28px; font-size:17px;
      font-weight:800; cursor:pointer;
      box-shadow: 0 8px 24px rgba(0,0,0,.12);
      transition: transform .15s ease;
      position:relative;
    }
    #yesBtn{
      background: linear-gradient(180deg,#22c55e,#16a34a);
      color:#fff;
    }
    #noBtn{
      background: linear-gradient(180deg,#fb7185,#ef4444);
      color:#fff;
    }
    #noBtn.escaping{
      position:absolute;
      z-index:99;
      transition: left .18s ease, top .18s ease;
    }

    .note{
      margin-top:20px; font-size:14px;
      font-weight:700; color:#6b7280;
      min-height:20px;
    }

    .pulse{ animation: pulse 1s ease-in-out infinite; }
    @keyframes pulse{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.08);} }

    .shake{ animation: shake .3s ease; }
    @keyframes shake{
      0%{ transform:translateX(0); }
      25%{ transform:translateX(-5px); }
      50%{ transform:translateX(5px); }
      75%{ transform:translateX(-3px); }
      100%{ transform:translateX(0); }
    }

    .particle{
      position:fixed; pointer-events:none;
      animation: fly 1.2s ease-out forwards;
      z-index:9999;
    }
    @keyframes fly{
      from{ opacity:1; transform:translate(-50%,-50%) translate(0,0) rotate(0); }
      to{ opacity:0; transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) rotate(var(--rot)); }
    }



    @media(max-width:400px){
      h1{ font-size:22px; }
      button{ padding:12px 22px; font-size:16px; }
    }
  </style>
</head>
<body>

  <div class="card" id="card">
    <div class="gif-top" id="gifTop"></div>
    <h1 id="title">Will you be my Valentine? 💘</h1>
    <p class="sub" id="sub">Choose wisely 👇</p>

    <div class="buttons" id="buttons">
      <button id="yesBtn">Yes 💕</button>
      <button id="noBtn">No 💔</button>
    </div>

    <p class="note" id="note"></p>
  </div>

  <script>
    const card    = document.getElementById("card");
    const yesBtn  = document.getElementById("yesBtn");
    const noBtn   = document.getElementById("noBtn");
    const note    = document.getElementById("note");
    const sub     = document.getElementById("sub");
    const title   = document.getElementById("title");
    const gifTop  = document.getElementById("gifTop");

    let noClicks = 0;
    let yesScale = 1;
    let noScale  = 1;
    let escapeEnabled = false;

    const noTexts = [
      "No 💔",
      "Are you sure? 🤔",
      "Are you positive? 🥺",
      "Please… 💖",
      "Think about it…",
      "Come on 😌",
      "Catch me! 🏃",
      "Too slow! 😂",
      "Give up? Say yes! 💘",
      "You meant yes 😏"
    ];

    const noteTexts = [
      "Don't hurt me 🥺",
      "Really?? 😢",
      "Please reconsider…",
      "My heart… 💔",
      "The button is scared 🏃",
      "Just say yes 😌",
      "Pretty please? 🥺",
      "Last chance…",
      "I know you want to 😏"
    ];

    function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }

    function shake(){
      card.classList.remove("shake");
      void card.offsetWidth;
      card.classList.add("shake");
    }

    function particles(x,y,n=12){
      const em = ["💖","✨","💘","💕","🌹","💝"];
      for(let i=0;i<n;i++){
        const p = document.createElement("div");
        p.className = "particle";
        p.textContent = em[Math.floor(Math.random()*em.length)];
        p.style.left = x+"px"; p.style.top = y+"px";
        p.style.fontSize = (16+Math.random()*14)+"px";
        p.style.setProperty("--dx",(Math.random()*200-100)+"px");
        p.style.setProperty("--dy",(Math.random()*200-160)+"px");
        p.style.setProperty("--rot",(Math.random()*540-270)+"deg");
        document.body.appendChild(p);
        setTimeout(()=>p.remove(),1300);
      }
    }

    function moveNo(){
      const cw = card.offsetWidth, ch = card.offsetHeight;
      const bw = noBtn.offsetWidth, bh = noBtn.offsetHeight;
      const p = 14;
      noBtn.style.left = (p + Math.random()*(cw-bw-p*2)) + "px";
      noBtn.style.top  = (p + Math.random()*(ch-bh-p*2)) + "px";
    }

    function startEscape(){
      if(escapeEnabled) return;
      escapeEnabled = true;
      noBtn.remove();
      card.appendChild(noBtn);
      noBtn.classList.add("escaping");
      moveNo();

      card.addEventListener("pointermove",(e)=>{
        if(!escapeEnabled) return;
        const b = noBtn.getBoundingClientRect();
        const dx = e.clientX-(b.left+b.width/2);
        const dy = e.clientY-(b.top+b.height/2);
        if(Math.hypot(dx,dy)<100) moveNo();
      });

      noBtn.addEventListener("touchstart",(e)=>{
        e.preventDefault(); moveNo();
      },{passive:false});
    }

    noBtn.addEventListener("click",(e)=>{
      noClicks++;
      yesScale = clamp(yesScale*1.15,1,3.5);
      noScale  = clamp(noScale*0.85,0.3,1);
      yesBtn.style.transform = `scale(${yesScale})`;
      if(!escapeEnabled) noBtn.style.transform = `scale(${noScale})`;
      if(noClicks>=3) yesBtn.classList.add("pulse");

      noBtn.textContent = noTexts[Math.min(noClicks, noTexts.length-1)];
      note.textContent  = noteTexts[noClicks % noteTexts.length];

      shake();
      particles(e.clientX,e.clientY,8);

      if(noClicks>=5){
        startEscape();
        moveNo();
      }
    });

    yesBtn.addEventListener("click",(e)=>{
      escapeEnabled = false;
      yesBtn.disabled = true;
      noBtn.style.display = "none";
      yesBtn.classList.remove("pulse");

      title.textContent = "You're stuck with me now 😏💍";
      sub.textContent = "No refunds, no returns";
      yesBtn.textContent = "Locked in 🔒";
      note.textContent = "";

      // Show a romantic couple GIF
      const gifs = [
        "https://gifdb.com/images/high/cute-animated-couple-hug-kissing-hnndzfpo7sm3ofgi.gif"
      ];
      const img = document.createElement("img");
      img.src = gifs[Math.floor(Math.random()*gifs.length)];
      img.alt = "Together";
      gifTop.appendChild(img);

      card.classList.add("success");
      particles(e.clientX,e.clientY,30);
    });
  </script>
</body>
</html>
